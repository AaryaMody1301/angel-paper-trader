name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
      - run: python -m pip install -r requirements-stream.txt
      - run: python -m unittest -v
      - run: python paper_trader.py demo
      - run: python ai_trader.py --help
      - run: git diff --check
  training-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-training.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest -v tests.test_ai_training
        env:
          REQUIRE_TRAINING_TESTS: '1'
